plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.booklistener'
    compileSdk 37

    defaultConfig {
        applicationId 'com.booklistener'
        minSdk 26
        targetSdk 34
        versionCode 46
        versionName '1.6.19'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // 本地验证体积用 debug 签名；正式发布应替换为 release keystore
            signingConfig signingConfigs.getByName("debug")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要加载 Android 资源
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    // Compose（v1.6.15 工具链升级：BOM 2026.06 / Compose 1.11.3，兼容 AGP 8.13；icons-extended 已脱离 BOM，显式固定 1.7.8 终版）
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'

    // Liquid Glass 特效（v1.6.15 工具链升级后引入：Compose Multiplatform backdrop）
    implementation 'io.github.kyant0:backdrop:2.0.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.4.0'
    implementation 'androidx.media3:media3-extractor:1.4.0'
    implementation 'androidx.media3:media3-ui:1.4.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.0'
    implementation 'androidx.media3:media3-session:1.4.0'
    // media3-session 对 media 是 runtime scope，MediaStyle 通知需显式声明为编译期依赖
    implementation 'androidx.media:media:1.7.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room
    implementation 'androidx.room:room-runtime:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // JSON
    implementation 'org.json:json:20240303'

    // Encrypted SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // 单元测试：JUnit + Robolectric + Compose UI Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
