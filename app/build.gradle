plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.booklistener'
    compileSdk 34

    defaultConfig {
        applicationId 'com.booklistener'
        minSdk 26
        targetSdk 34
        versionCode 40
        versionName '1.6.13'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // 本地验证体积用 debug 签名；正式发布应替换为 release keystore
            signingConfig signingConfigs.getByName("debug")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要加载 Android 资源
            includeAndroidResources = true
        }
    }

    // 强制 kotlin-stdlib 与编译插件版本（1.9.24）一致，避免传递依赖解析到 2.1.x 导致元数据不兼容
    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.4.0'
    implementation 'androidx.media3:media3-extractor:1.4.0'
    implementation 'androidx.media3:media3-ui:1.4.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.0'
    implementation 'androidx.media3:media3-session:1.4.0'
    // media3-session 对 media 是 runtime scope，MediaStyle 通知需显式声明为编译期依赖
    implementation 'androidx.media:media:1.7.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room
    implementation 'androidx.room:room-runtime:2.7.0'
    kapt 'androidx.room:room-compiler:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // JSON
    implementation 'org.json:json:20240303'

    // Encrypted SharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // 单元测试：JUnit + Robolectric + Compose UI Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
