# 工具链升级（v1.6.15）后内存预算重排：
# 总硬限 4G cgroup。R8 处理 Compose 1.11 + backdrop + icons-extended 输入较大，
# 单独给 R8 堆；daemon 与 kotlin daemon 下调，避免峰值叠加破顶。
# v1.6.17：daemon 再降至 1G（KSP 在 Kotlin daemon 内执行，1536+1024+元空间峰值曾静默 OOM 杀进程）。
# v1.6.23：R8 worker 3G + daemon 1G + kotlin 1G 峰值顶破 4G cgroup → daemon 失联崩溃
# （"Could not receive a message from the daemon"）。R8 降至 2G（实测峰值 ~3G 有余量），
# 并启用 full mode（R8 非 full mode 对 Compose 大输入极慢，曾 25 分钟无产物）。
# v1.6.23 r8 二次：SerialGC 在 1.4G+ 堆上 full GC 风暴是"R8 卡住"真因（三次 20+ 分钟无产物），
# daemon 换 ParallelGC（吞吐型），R8 开 4 线程（AGP 实验属性）。
# v1.6.23 r8 四次：2.5G 仍 OOM → 3G（ParallelGC 下 R8 阶段仅 ~3 分钟，峰值窗口短；
# 之前 3G 崩为 SerialGC 15 分钟累积，不可比）。
# v1.6.23 r8 五次：3G 仍 OOM（GC overhead）→ 多线程(4)扩大并行工作集是内存主因之一，
# 改回单线程(1) + 精简 keep（media3/coroutines 全量 keep 移除，见 proguard-rules.pro）。
# v1.6.23 r8 六次：单线程 51 分钟未完成（R8 图分析退化）→ 定位真凶 icons-extended
# （数千图标类拖垮 R8 图分析），已移除依赖改 icons-core + 项目内自绘 AppIcons
# （ui/icons/AppIcons.kt）。输入大减后恢复 4 线程提速。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
android.experimental.r8.maxHeapSize=3072m
android.experimental.r8.threadCount=4
android.enableR8.fullMode=true
